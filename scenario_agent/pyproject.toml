[build-system]
requires = ["setuptools>=68", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-scenario-agent"
version = "0.1.0"
description = "Catalog-grounded, planning-only Scenario Agent for an authorized SOC lab"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "jsonschema>=4.20,<5", "python-dotenv>=1,<2", "numpy>=1.24,<3", "Pillow>=10,<13", "google-genai>=1,<3", "langgraph>=1,<2", "sentence-transformers>=3,<6", "faiss-cpu>=1.8,<2"]

[project.scripts]
scenario-agent = "scenario_agent.cli:main"

[tool.setuptools.packages.find]
include = ["scenario_agent*", "scripts*"]
