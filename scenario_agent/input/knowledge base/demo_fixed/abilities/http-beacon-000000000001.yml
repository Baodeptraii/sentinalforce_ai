- id: http-beacon-000000000001
  name: Periodic HTTP Beaconing to Internal Listener
  description: >-
    Sends exactly 5 HTTP POST heartbeats, 3 seconds apart, to an approved internal listener and reports each response status. Payloads are synthetic training markers only.
  technique_id: T1071.001
  technique_name: 'Application Layer Protocol: Web Protocols'
  repeatable: false
  executors:
    - name: psh
      platform: windows
      command: |
        $ErrorActionPreference = 'Stop'
        $ok = 0
        for ($i = 1; $i -le 5; $i++) {
          try {
            $resp = Invoke-WebRequest -UseBasicParsing -Method Post -Uri 'http://192.168.1.164:18765/beacon' -Body ("run=ep03&seq=" + $i + "&at=" + (Get-Date -Format o)) -ContentType 'application/x-www-form-urlencoded' -TimeoutSec 5
            Write-Output ("EP03_BEACON seq=" + $i + " status=" + $resp.StatusCode)
            if ($resp.StatusCode -eq 200) { $ok = $ok + 1 }
          } catch { Write-Output ("EP03_BEACON seq=" + $i + " error") }
          if ($i -lt 5) { Start-Sleep -Seconds 3 }
        }
        Write-Output ("EP03_BEACON_SUMMARY accepted=" + $ok + " of 5")
        if ($ok -lt 5) { exit 1 }
        exit 0
      timeout: 90
