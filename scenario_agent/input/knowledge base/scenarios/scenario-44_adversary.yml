id: 340bee33-bfad-518a-abb9-a8d79a7cc1a4
name: '[SCENARIO-44] GPO Abuse – Triển khai payload qua Group Policy'
description: Trong kịch bản này, tác nhân đã có quyền sửa hoặc liên kết GPO, hoặc
  chiếm một tài khoản được ủy quyền quản trị policy trong AD. Từ đó, họ thay đổi script
  khởi động, scheduled task, software deployment hoặc tham chiếu file trong SYSVOL
  để đẩy nội dung có kiểm soát tới số lượng lớn endpoint. Actor thường là intruder
  đã vào sâu trong AD, ransomware affiliate hoặc operator nhắm tới domain-wide execution;
  điều kiện tiên quyết là quyền
