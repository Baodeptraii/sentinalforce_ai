name: '[SCENARIO-68] SIM Swapping dẫn đến chiếm quyền tài khoản quan trọng'
description: Trong kịch bản này, đối thủ dùng thông tin cá nhân bị rò rỉ, social engineering
  hoặc lạm dụng quy trình hỗ trợ để chiếm quyền kiểm soát số điện thoại của mục tiêu.
  Sau đó, đối thủ dùng số này để hoàn tất quy trình reset mật khẩu, nhận OTP hoặc
  vượt qua một lớp xác thực SMS. Actor thường là nhóm social engineering, cybercrime
  hoặc nhóm giống Scattered Spider; điều kiện tiên quyết là tài khoản quan trọng
