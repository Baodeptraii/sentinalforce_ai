name: '[SCENARIO-58] Ransomware Deployment – Akira/LockBit 3.0 Pattern'
description: 'Trong kịch bản này, sau khi đã có quyền trên nhiều host và thường đã
  hoàn tất một phần data theft, tác nhân triển khai ransomware theo mô hình phổ biến
  của các nhóm như Akira hoặc LockBit 3.0: làm suy yếu khôi phục, vô hiệu một số dịch
  vụ cản trở, rồi kích hoạt quá trình mã hóa trên diện rộng. Actor thường là ransomware
  affiliate hoạt động có điều phối; điều kiện tiên quyết là đã có quyền'
