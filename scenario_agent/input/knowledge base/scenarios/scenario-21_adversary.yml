name: '[SCENARIO-21] LSASS Memory Dumping – Mimikatz-style'
description: Sau khi có quyền quản trị cục bộ hoặc khả năng truy cập handle tới tiến
  trình LSASS, kẻ tấn công thực hiện dump bộ nhớ hoặc trích xuất credential material
  từ tiến trình này bằng công cụ quen thuộc hoặc binary sống nhờ hệ thống. Điều kiện
  tiên quyết là đặc quyền đủ cao trên endpoint. Kết quả mong muốn là thu được NTLM
  hash, plaintext credential, ticket material hoặc dữ liệu xác thực đủ để tiếp tục
  sang
