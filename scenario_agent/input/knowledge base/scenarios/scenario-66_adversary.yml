name: '[SCENARIO-66] Insider Threat – Data Exfiltration trước khi nghỉ việc'
description: Trong kịch bản này, một nhân viên sắp nghỉ việc, chuyển bộ phận hoặc
  có dấu hiệu rủi ro sao chép tài liệu nội bộ, mã nguồn, danh sách khách hàng, hợp
  đồng hoặc dữ liệu dự án ra USB, cloud cá nhân hoặc email cá nhân. Actor là insider
  có quyền truy cập hợp lệ; điều kiện tiên quyết là có quyền đọc dữ liệu và kênh đưa
  dữ liệu ra ngoài chưa bị kiểm soát chặt; kết quả
