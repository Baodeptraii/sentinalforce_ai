name: '[SCENARIO-17] DLL Sideloading – Persistence và Defense Evasion'
description: Sau khi có khả năng ghi file lên máy đích hoặc thư mục cài đặt của một
  ứng dụng, kẻ tấn công đặt DLL độc hại trùng tên với dependency mà ứng dụng đang
  mong đợi. Actor thường là tác nhân hậu xâm nhập muốn duy trì hiện diện hoặc ngụy
  trang việc thực thi dưới một tiến trình tin cậy. Điều kiện tiên quyết là quyền ghi
  file vào thư mục cùng cấp với executable hoặc một vị trí
