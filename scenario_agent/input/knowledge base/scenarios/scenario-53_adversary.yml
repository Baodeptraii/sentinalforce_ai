id: 686ffed5-adb9-5b62-b55e-a8cfcaca3b64
name: '[SCENARIO-53] Azure AD / Entra ID – Consent Phishing'
description: Trong kịch bản này, đối phương chuẩn bị một ứng dụng OAuth hoặc service
  principal có bề ngoài có vẻ hợp pháp, sau đó dẫn người dùng tới luồng consent để
  chấp thuận các quyền như đọc mail, đọc file, truy cập profile hoặc duy trì quyền
  truy cập ngoại tuyến. Actor thường là nhóm cloud-focused intrusion, BEC actor hoặc
  espionage operator; điều kiện tiên quyết là tenant cho phép user consent rộng hoặc
  cơ chế kiểm duyệt publisher/scopes chưa
