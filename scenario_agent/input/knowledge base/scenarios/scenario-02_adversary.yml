id: a800f886-1f0b-518a-9db1-04188c272d08
name: '[SCENARIO-02] Phishing AiTM (Adversary-in-the-Middle) Đánh Cắp Session Cookie'
description: Kẻ tấn công gửi email phishing với link dẫn đến reverse proxy. Người
  dùng đăng nhập và hoàn tất MFA thông qua proxy — proxy chuyển tiếp request đến server
  thật và nhận session cookie hợp lệ. Kẻ tấn công sử dụng cookie này để đăng nhập
  vào tài khoản mà không cần MFA.
