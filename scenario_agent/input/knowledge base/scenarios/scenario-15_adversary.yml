id: b100bc49-8357-5a49-a016-98be5b2c05cf
name: '[SCENARIO-15] WMI Abuse – Thực Thi Từ Xa và Event Subscription Persistence'
description: Sau khi chiếm credential, kẻ tấn công dùng `wmic /node:target` hoặc PowerShell
  `Invoke-WMIMethod` để thực thi lệnh từ xa mà không tạo service mới. Để persistence,
  kẻ tấn công tạo WMI Event Subscription gồm EventFilter + EventConsumer + FilterToConsumerBinding
  — payload chạy mỗi khi có event trigger (login, 5 phút sau boot, v.v.).
