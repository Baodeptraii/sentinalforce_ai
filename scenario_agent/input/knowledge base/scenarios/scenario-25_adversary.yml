name: '[SCENARIO-25] Pass-the-Hash – Lateral Movement không cần mật khẩu'
description: Sau khi thu được NTLM hash từ LSASS, SAM hoặc nguồn lưu trữ khác, kẻ
  tấn công dùng hash đó để xác thực tới máy chủ hoặc máy trạm khác qua SMB, WinRM,
  WMI hoặc các dịch vụ tương đương. Actor thường là tác nhân nội bộ đã kiểm soát ít
  nhất một host. Điều kiện tiên quyết là hash hợp lệ và giao thức đích cho phép xác
  thực phù hợp. Kết quả mong muốn là di chuyển ngang
