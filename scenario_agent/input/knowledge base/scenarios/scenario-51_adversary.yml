id: e933983c-cad0-5701-ab92-a670be2caaaf
name: '[SCENARIO-51] Exfiltration qua Cloud Storage (OneDrive/Dropbox/MEGA)'
description: Trong kịch bản này, sau khi đã có tập dữ liệu staging, tác nhân upload
  các archive hoặc file nhạy cảm lên cloud storage hợp lệ bằng trình duyệt, ứng dụng
  đồng bộ, API client hoặc công cụ chuyên dụng được ngụy trang như thao tác người
  dùng bình thường. Actor thường là nhóm đánh cắp dữ liệu, ransomware affiliate hoặc
  operator muốn chuyển dữ liệu ra ngoài trước khi impact; điều kiện tiên quyết là
  đã có dữ liệu
