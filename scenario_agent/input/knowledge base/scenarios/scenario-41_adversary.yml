name: '[SCENARIO-41] Lateral Movement qua RDP – Brute Force và Session Hijacking'
description: Trong kịch bản này, kẻ tấn công dùng credential đánh cắp, brute-force
  nội bộ, hoặc một phiên người dùng còn sống để mở RDP sang máy khác trong mạng và
  thao tác trực tiếp như một người quản trị hoặc người dùng hợp lệ. Actor thường là
  operator hậu khai thác, ransomware affiliate hoặc kẻ xâm nhập AD đang cần tương
  tác GUI để đi nhanh; điều kiện tiên quyết là có credential hợp lệ hoặc quyền đủ
  để lợi
