name: '[SCENARIO-45] Active Directory Enumeration – BloodHound / SharpHound'
description: Trong kịch bản này, tác nhân đã có ít nhất một tài khoản domain mức thấp
  và bắt đầu thu thập có hệ thống cấu trúc AD để dựng đồ thị quan hệ đặc quyền. Actor
  thường là operator hậu khai thác, red team hoặc adversary nhắm tới privilege escalation
  trong domain; điều kiện tiên quyết là có domain foothold và khả năng truy vấn LDAP/ADWS/SMB
  ở mức người dùng hợp lệ; kết quả mong muốn là xác định được
