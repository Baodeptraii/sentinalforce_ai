id: 865cf8b9-68f9-5794-a305-df27a0d4590a
name: '[SCENARIO-50] Domain Fronting – C2 ẩn sau CDN hợp lệ'
description: Trong kịch bản này, implant trên host bị compromise hướng lưu lượng HTTPS
  qua một CDN hoặc edge provider phổ biến, dùng cấu hình request sao cho kết nối trông
  giống truy cập tới dịch vụ hợp lệ nhưng thực chất điều hướng vào hạ tầng điều khiển
  do đối phương chuẩn bị. Actor thường là nhóm cần vượt egress control theo domain
  hoặc hoạt động trong mạng chỉ cho phép số ít CDN/cloud lớn; điều kiện tiên quyết
  là
