id: 17a93fea-1714-5428-801c-073642aae8f9
name: '[SCENARIO-28] Token Impersonation – SeImpersonatePrivilege Abuse'
description: Kẻ tấn công đã có code execution trên một host và đang chạy trong ngữ
  cảnh có `SeImpersonatePrivilege` hoặc quyền tương đương có thể bị lạm dụng. Actor
  phù hợp là tác nhân hậu khai thác nhắm tới local privilege escalation nhanh trên
  máy chủ ứng dụng hoặc máy trạm. Điều kiện tiên quyết là tiến trình ban đầu có quyền
  gắn / mạo danh token. Kết quả mong muốn là tạo ra một tiến trình mới với mức đặc
