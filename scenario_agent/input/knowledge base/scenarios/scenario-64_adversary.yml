name: '[SCENARIO-64] APT29 / Midnight Blizzard – Cloud Lateral Movement'
description: Trong kịch bản này, tác nhân đã có quyền truy cập vào một tài khoản,
  ứng dụng, service principal hoặc chuỗi trust liên quan cloud, sau đó tận dụng quyền
  đó để pivot sang mailbox, repository, tenant khác, hoặc hệ thống SaaS được liên
  kết. Actor thường là nation-state intrusion operator; điều kiện tiên quyết là có
  credential, token, OAuth permission hoặc trusted relationship bị lạm dụng; kết quả
  mong muốn là mở rộng quyền truy cập trong môi trường
