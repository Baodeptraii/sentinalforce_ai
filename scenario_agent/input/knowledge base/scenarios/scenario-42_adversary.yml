name: '[SCENARIO-42] PsExec / SMB Lateral Movement'
description: Trong kịch bản này, kẻ tấn công đã có credential quản trị cục bộ hoặc
  miền và dùng SMB share / service creation để thực thi từ xa trên máy khác, có thể
  bằng PsExec thật hoặc một biến thể chức năng tương đương. Actor thường là operator
  hậu khai thác hoặc ransomware affiliate muốn lan nhanh trong mạng Windows; điều
  kiện tiên quyết là có quyền admin trên host đích và kết nối mạng nội bộ cho SMB/RPC;
  kết
