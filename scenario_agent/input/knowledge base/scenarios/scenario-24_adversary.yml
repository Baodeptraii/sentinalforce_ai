name: '[SCENARIO-24] DCSync – Giả lập Domain Controller để dump credential'
description: Kẻ tấn công đã chiếm được một tài khoản có quyền replication hoặc đã
  leo thang đến nhóm / quyền cho phép thực hiện replication directory. Điều kiện tiên
  quyết là quyền trên AD đủ để gọi chuỗi replication. Từ một máy không nhất thiết
  là DC, tác nhân gửi yêu cầu đồng bộ dữ liệu nhạy cảm và thu về credential material
  của các tài khoản miền, bao gồm cả tài khoản có giá trị cao. Kết quả mong
