id: 5861be37-9a03-5055-910f-92cbbb04f7b2
name: '[SCENARIO-19] Registry Run Key – Autostart Persistence'
description: Sau khi đã chạy được code trên endpoint, kẻ tấn công ghi một giá trị
  vào `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`, `RunOnce`, hoặc biến thể
  trong `HKLM`. Actor thường là malware loader, stealer, hoặc tác nhân hậu khai thác
  muốn bảo đảm payload quay lại sau đăng nhập. Điều kiện tiên quyết là quyền ghi registry
  tại hive tương ứng. Kết quả mong muốn là một binary, script hoặc LOLBin được gọi
  lại khi người dùng đăng nhập hoặc máy khởi động lại.
