id: eee25f9c-1f7d-5d89-a341-858649421c0a
name: '[SCENARIO-38] Living-off-the-Land – LOLBins (certutil, mshta, regsvr32)'
description: Trong kịch bản này, tác nhân đã có điểm bám ban đầu trên máy nạn nhân
  và sử dụng một hoặc nhiều LOLBins như `certutil`, `mshta`, `regsvr32` hoặc utility
  tương đương để tải nội dung, giải mã, proxy execution hoặc kích hoạt stage kế tiếp
  mà không cần drop custom loader dễ bị nhận diện. Actor thường là malware loader,
  post-exploitation operator hoặc nhóm thích giảm dấu vết công cụ; điều kiện tiên
  quyết là có interactive execution hoặc script
