name: '[SCENARIO-56] Kubernetes Escape – Container Breakout'
description: Trong kịch bản này, tác nhân đã compromise một container hoặc pod và
  lợi dụng cấu hình nguy hiểm như privileged container, hostPath mount, capability
  quá rộng, runtime exposure hoặc cơ chế liên đới của node để thoát ra ngoài phạm
  vi container, tiếp cận host hoặc API điều khiển cluster. Actor thường là cloud-native
  intruder, nhóm nhắm vào CI/CD hoặc đối thủ tận dụng sai cấu hình container; điều
  kiện tiên quyết là pod có sai cấu hình hoặc
