id: 7f11a926-b12a-5d2b-81e4-0c9b54717eee
name: '[SCENARIO-10] Supply Chain – Gói Độc Hại npm/PyPI (Dependency Confusion)'
description: Kẻ tấn công phát hiện tổ chức dùng gói nội bộ có tên `company-utils`
  (không publish lên public registry). Tải lên npm gói tên `company-utils` với version
  cao hơn và preinstall script độc hại. Khi developer hoặc CI/CD chạy `npm install`,
  gói public được tải về thay vì gói nội bộ, script độc hại thực thi.
