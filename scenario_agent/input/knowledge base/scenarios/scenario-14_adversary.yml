id: 59695de3-b22c-5334-acce-dc6b3d04934a
name: '[SCENARIO-14] PowerShell Fileless Malware – Thực Thi Hoàn Toàn Trong Bộ Nhớ'
description: Kẻ tấn công gửi macro-enabled document hoặc exploit tạo PowerShell process.
  PowerShell tải script từ internet (encoded base64), decode trong memory, thực thi
  shellcode thông qua .NET reflection hoặc `Add-Type`. Shellcode inject vào tiến trình
  hợp lệ, establish C2.
