name: '[SCENARIO-16] Scheduled Task – Persistence và Lateral Movement'
description: Sau khi đã có foothold trên một máy trạm hoặc có được credential quản
  trị cục bộ, kẻ tấn công tạo một scheduled task ngụy trang dưới tên có vẻ hợp lệ
  như `Updater`, `OneDrive Sync`, hoặc đặt trong namespace gần giống tác vụ hệ thống.
  Điều kiện tiên quyết thường là quyền tạo task cục bộ hoặc quyền quản trị từ xa qua
  SMB/RPC. Kết quả mong muốn là payload được kích hoạt lại khi login, startup hoặc
  theo
