id: d10dc8b0-d4e1-5dac-acfb-513b42c07ba0
name: '[SCENARIO-04] Callback Phishing (TOAD – Telephone-Oriented Attack Delivery)'
description: 'Kẻ tấn công gửi email giả mạo thông báo đăng ký dịch vụ (ví dụ: Norton
  Antivirus, McAfee, Microsoft) với số tiền lớn và yêu cầu gọi điện nếu không đồng
  ý. Nạn nhân hoảng loạn và gọi điện. Call center giả mạo hướng dẫn cài AnyDesk/TeamViewer/ScreenConnect.
  Qua đó, kẻ tấn công chiếm quyền điều khiển máy tính.'
