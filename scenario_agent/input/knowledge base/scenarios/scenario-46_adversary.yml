id: e2f44c45-e9da-553e-82e4-d88a4a49576b
name: '[SCENARIO-46] Network Share Enumeration và Staging Dữ liệu'
description: Trong kịch bản này, tác nhân đã có foothold trong mạng nội bộ với ít
  nhất một tài khoản người dùng hợp lệ hoặc một host bị compromise, sau đó liệt kê
  các network share có thể truy cập, xác định thư mục chứa tài liệu nhạy cảm và sao
  chép dữ liệu về một vị trí staging cục bộ hoặc share trung gian trước khi nén lại.
  Actor thường là post-exploitation operator, ransomware affiliate hoặc nhóm đánh
  cắp dữ
