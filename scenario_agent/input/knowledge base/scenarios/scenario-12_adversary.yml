name: '[SCENARIO-12] MFA Fatigue / Push Bombing'
description: Kẻ tấn công có được credential (password) hợp lệ qua phishing hoặc data
  breach. Liên tục thử đăng nhập → trigger hàng chục push MFA. Đồng thời, kẻ tấn công
  gọi điện giả vờ IT helpdesk, giải thích rằng có sự cố hệ thống và yêu cầu chấp nhận
  notification. Nạn nhân chấp nhận → kẻ tấn công vào được account.
