description: Trong kịch bản này, tác nhân đe doạ sử dụng danh sách tài khoản bị lộ
  từ breach cũ hoặc chọn một nhóm mật khẩu phổ biến để thử theo kiểu low-and-slow
  lên Entra ID, VPN, OWA, cổng SSO hoặc bề mặt xác thực AD được publish ra ngoài.
  Actor thường là các nhóm intrusion ban đầu hoặc cybercrime operators muốn lấy initial
  access rẻ và khó bị chú ý; điều kiện tiên quyết là tồn tại bề mặt xác
