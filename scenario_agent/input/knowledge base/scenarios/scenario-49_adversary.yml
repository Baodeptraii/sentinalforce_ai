id: 502f015f-97f2-5596-9ab0-037adff47fd0
name: '[SCENARIO-49] C2 qua Dịch vụ Web Hợp lệ (Slack/GitHub/Telegram)'
description: Trong kịch bản này, malware hoặc implant dùng API của Slack, GitHub,
  Telegram hoặc một dịch vụ web hợp lệ tương tự để nhận chỉ thị, đẩy kết quả và duy
  trì C2 dưới hình thức gọi API tưởng như bình thường. Actor thường là tác nhân muốn
  tránh IOC-based blocklist hoặc hoạt động trong môi trường proxy chặn nghiêm ngặt
  các domain “xấu” nhưng vẫn cho phép SaaS phổ biến; điều kiện tiên quyết là host
  đã bị compromise
