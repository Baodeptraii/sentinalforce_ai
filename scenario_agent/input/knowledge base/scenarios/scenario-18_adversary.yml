id: fb2f98a4-6fc9-5e3c-bb7d-5fd59c641d8f
name: '[SCENARIO-18] Web Shell – Persistence trên Web Server'
description: Kẻ tấn công khai thác thành công một ứng dụng công khai hoặc dùng credential
  quản trị web để tải lên một file `.aspx`, `.php`, `.jsp`, `.ashx` hoặc biến thể
  tương tự vào webroot. Actor phù hợp cho scenario này là tác nhân đã có initial access
  trên web tier và muốn duy trì truy cập ngay cả khi session ban đầu mất đi. Điều
  kiện tiên quyết là quyền upload file, write file sau RCE, hoặc đường dẫn deployment
