name: '[SCENARIO-52] Exfiltration qua Email – Email Forwarding Rule ẩn'
description: Trong kịch bản này, sau khi chiếm được quyền truy cập vào mailbox doanh
  nghiệp, kẻ tấn công tạo rule hoặc cấu hình forwarding ẩn để tự động chuyển email,
  tệp đính kèm hoặc thư khớp điều kiện nhất định tới một địa chỉ ngoài tổ chức. Actor
  thường là BEC operator, espionage actor hoặc nhóm muốn thu thập thông tin liên tục
  mà tránh tải toàn bộ mailbox; điều kiện tiên quyết là đã có quyền thao tác mailbox
