name: '[SCENARIO-37] Timestomping & Log Xóa – Xóa dấu vết tấn công'
description: Trong kịch bản này, tác nhân hậu khai thác đã có quyền đủ cao trên host
  và chủ động làm suy yếu khả năng truy vết bằng cách xóa các nhật ký sự kiện then
  chốt, sửa mốc thời gian của file mới tạo, hoặc làm mờ dấu nối giữa payload, persistence
  và hoạt động tương tác. Actor thường là ransomware affiliate, operator dùng hands-on-keyboard,
  hoặc malware muốn kéo dài dwell time; điều kiện tiên quyết là có đặc quyền
