name: '[SCENARIO-01] Spearphishing với Tệp Đính Kèm Độc Hại (Office Macro)'
description: Tác nhân đe doạ (thường là cybercrime groups như TA505, TA571, hoặc APT
  nhắm vào lĩnh vực tài chính/chính phủ) gửi email được thiết kế cẩn thận đến mục
  tiêu cụ thể. Nội dung email giả mạo là hoá đơn, hợp đồng, thông báo nhân sự, hoặc
  tài liệu quan trọng. Tệp đính kèm là file .docm, .xlsm, hoặc .xls cũ (Binary format)
  chứa macro VBA độc hại. Khi người dùng kích hoạt macro, một payload (thường là loader
  như
