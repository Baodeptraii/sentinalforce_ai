name: '[SCENARIO-20] Boot Sector / Bootkit Persistence (UEFI Implant)'
description: Một tác nhân đã có quyền cao trên host hoặc quyền đủ để can thiệp vào
  boot chain tiến hành sửa thành phần trong EFI System Partition hoặc firmware liên
  quan, hoặc lợi dụng cơ chế cập nhật firmware / driver dễ bị lạm dụng. Điều kiện
  tiên quyết là quyền thực thi ở mức rất cao và khả năng ghi vào vùng trước OS. Mục
  tiêu cuối là tạo cơ chế tồn tại qua reboot, thậm chí qua cài
