id: 2e1c603b-1a8a-571e-86aa-960cc8a732d4
name: '[SCENARIO-43] SSH Lateral Movement – Credential Reuse và Agent Hijacking'
description: Trong kịch bản này, kẻ tấn công tái sử dụng credential SSH đã đánh cắp,
  private key bị lộ, hoặc lợi dụng SSH agent/agent forwarding của một phiên hợp lệ
  để đăng nhập sang host Linux khác. Actor thường là post-exploitation operator, cloud/Linux
  intruder hoặc nhóm nhắm vào hạ tầng lai; điều kiện tiên quyết là có thông tin xác
  thực SSH, agent socket có thể bị sử dụng sai mục đích, hoặc key material bị lộ từ
  host đầu
