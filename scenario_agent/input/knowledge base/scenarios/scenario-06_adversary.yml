id: b53f7acf-b142-5554-8fd5-55b16e8bca0e
name: '[SCENARIO-06] Khai Thác Ứng Dụng Công Khai – SQL Injection → RCE → Web Shell'
description: Kẻ tấn công quét ứng dụng web công khai, phát hiện SQL injection trong
  form đăng nhập hoặc parameter. Sử dụng SQLMap hoặc manual để khai thác, leo thang
  đến xp_cmdshell (MSSQL) hoặc ghi web shell. Từ web shell, thực thi lệnh, tải tool,
  và mở rộng vào mạng nội bộ.
