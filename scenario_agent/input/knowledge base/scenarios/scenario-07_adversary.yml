name: '[SCENARIO-07] Khai Thác Log4Shell (CVE-2021-44228) Còn Tồn Tại Đến 2024'
description: Kẻ tấn công quét internet tìm ứng dụng Java/Spring Boot public-facing
  có Log4j dễ bị tấn công. Gửi JNDI lookup string trong HTTP header (User-Agent, X-Forwarded-For,
  etc.). Server ghi log request → Log4j xử lý JNDI → kết nối đến server của kẻ tấn
  công → tải class Java độc hại → thực thi mã.
