id: a0955dca-9794-550f-9ee9-fad80f9ba5bc
name: '[SCENARIO-34] Process Injection – DLL Injection vào tiến trình hợp lệ'
description: Trong kịch bản này, tác nhân hậu khai thác đã có foothold trên endpoint
  và thực hiện chèn DLL hoặc vùng mã nhớ vào một tiến trình hợp lệ đang chạy để ẩn
  quá trình thực thi kế tiếp. Actor thường là loader, implant hậu xâm nhập hoặc operator
  cần giảm khả năng bị người dùng và EDR chú ý; điều kiện tiên quyết là đã có quyền
  truy cập tiến trình đích ở mức đủ để ghi bộ nhớ
