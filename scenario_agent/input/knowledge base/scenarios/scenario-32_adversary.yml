id: bb6f665a-297b-5256-8f8f-21cb419c0eb3
name: '[SCENARIO-32] Browser Credential Theft – Đánh cắp mật khẩu lưu trên trình duyệt'
description: Trong kịch bản này, malware hoặc tác nhân hậu khai thác đọc credential
  store của Chrome, Edge hoặc Firefox trong profile người dùng, sau đó lợi dụng ngữ
  cảnh người dùng hiện tại để giải mã dữ liệu được bảo vệ bởi cơ chế hệ điều hành
  hoặc profile key liên quan. Actor thường là stealer malware, initial access broker
  hoặc operator muốn chuyển nhanh từ foothold trên một máy sang chiếm trình duyệt,
  tài khoản web và session cloud;
