id: ed3ba093-eae7-59fb-af20-6cab477fdece
name: '[SCENARIO-67] OT/ICS Pivot – Từ IT Network sang Operational Technology'
description: Trong kịch bản này, tác nhân đã có foothold trong IT network, sau đó
  tìm các jump host, historian server, engineering workstation, tài khoản bảo trì
  hoặc firewall rule cho phép đi vào OT/ICS. Actor có thể là nation-state, destructive
  actor hoặc ransomware group nhắm vào vận hành; điều kiện tiên quyết là tồn tại kết
  nối IT-OT hoặc tài khoản/host trung gian có quyền truy cập OT; kết quả mong muốn
  là quan sát, gián đoạn hoặc thao túng
