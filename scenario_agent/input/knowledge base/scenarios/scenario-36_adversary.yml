id: c347977a-58ab-5a2a-b348-39eb053c4589
name: '[SCENARIO-36] AMSI Bypass – Vô hiệu hóa Antimalware Scan Interface'
description: Trong kịch bản này, tác nhân đã hiện diện trên host và chuẩn bị thực
  hiện hoặc tiếp tục một chuỗi script-based execution, nhưng trước đó tìm cách làm
  suy yếu AMSI ở mức process hoặc memory để giảm khả năng bị quét. Actor thường là
  operator hậu khai thác hoặc malware fileless phụ thuộc nhiều vào PowerShell/in-memory
  script; điều kiện tiên quyết là có code execution trên host và quyền thao tác đủ
  để làm thay đổi trạng thái
