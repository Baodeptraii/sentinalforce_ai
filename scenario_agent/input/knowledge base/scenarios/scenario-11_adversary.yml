id: 3ade1d65-da6f-5ba5-bd72-bc9b3b19f1e2
name: '[SCENARIO-11] Phishing qua QR Code (Quishing)'
description: Email chứa QR code (thường giả mạo Microsoft MFA reset, DocuSign, HR
  notification). Người dùng scan bằng điện thoại cá nhân → truy cập trang phishing
  trông giống Microsoft 365 login → nhập thông tin xác thực và hoàn tất MFA → session
  cookie hoặc credential bị đánh cắp.
