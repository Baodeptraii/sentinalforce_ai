id: 97e37b13-7494-518c-a0ce-1c56a390c1ea
name: '[SCENARIO-03] Business Email Compromise (BEC) – Wire Transfer Fraud'
description: Kẻ tấn công chiếm tài khoản email hợp lệ của CEO/CFO/kế toán qua phishing,
  sau đó giám sát hộp thư để tìm thời điểm thích hợp (giao dịch đang chờ xử lý). Khi
  phát hiện cơ hội, kẻ tấn công gửi email yêu cầu thay đổi thông tin ngân hàng hưởng
  thụ hoặc yêu cầu chuyển tiền khẩn.
