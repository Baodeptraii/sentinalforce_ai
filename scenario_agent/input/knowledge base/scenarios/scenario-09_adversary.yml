id: b04cddf6-fd84-590a-a7b9-9eae39cd1d82
name: '[SCENARIO-09] Supply Chain Compromise – Trojanized Software Update (SolarWinds
  Pattern)'
description: Kẻ tấn công (APT29/Cozy Bear trong trường hợp SolarWinds) xâm nhập vào
  build pipeline của vendor phần mềm, inject backdoor (SUNBURST) vào bản cập nhật
  hợp lệ. Bản cập nhật được ký bởi code signing certificate thật của vendor, phát
  tán đến 18,000+ tổ chức. Backdoor nằm im (dormant) 2 tuần trước khi activate để
  tránh sandbox detection.
