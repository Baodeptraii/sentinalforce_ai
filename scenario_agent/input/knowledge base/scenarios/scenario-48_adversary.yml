id: f32455e4-9c19-58e7-9e4f-68c6fbb25a96
name: '[SCENARIO-48] DNS Tunneling – C2 và Exfiltration qua DNS'
description: Trong kịch bản này, malware hoặc implant trên máy nạn nhân mã hóa chuỗi
  điều khiển hoặc dữ liệu thành các nhãn phụ của truy vấn DNS, sau đó gửi ra một authoritative
  domain do kẻ tấn công kiểm soát và nhận phản hồi chỉ đạo thông qua DNS response.
  Actor thường là nhóm cần kênh C2 phụ, hoạt động trong môi trường egress bị siết
  chặt hoặc muốn diễn giải lưu lượng của mình như DNS bình thường; điều
