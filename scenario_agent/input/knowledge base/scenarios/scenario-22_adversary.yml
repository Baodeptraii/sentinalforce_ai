id: 972e7410-b576-5ba9-a4c2-ed6defe4a5dc
name: '[SCENARIO-22] Kerberoasting – Tấn công Service Account'
description: Một tác nhân đã có tài khoản domain người dùng thông thường tiến hành
  liệt kê service account có SPN rồi yêu cầu Kerberos service ticket cho các tài khoản
  đó. Điều kiện tiên quyết chỉ là quyền xác thực miền ở mức thấp. Mục tiêu cuối là
  lấy được ticket material để brute-force offline, từ đó thu mật khẩu của service
  account và đổi lợi thế này thành đặc quyền cao hơn hoặc truy cập dịch vụ nhạy cảm.
