id: b1eab73a-ba6f-5805-8ad2-13637eb46c00
name: '[SCENARIO-23] AS-REP Roasting – Tài khoản không cần Pre-Auth'
description: Tác nhân đe dọa có thể là người dùng nội bộ đã xác thực hoặc thậm chí
  một thực thể ở vùng quan sát AD đủ để gửi yêu cầu ban đầu. Điều kiện tiên quyết
  là tồn tại ít nhất một tài khoản AD bị tắt pre-auth. Kẻ tấn công xác định các account
  như vậy, yêu cầu AS-REP tương ứng và mang dữ liệu đi brute-force offline. Kết quả
  mong muốn là chiếm được tài khoản đích mà
