$schema: https://json-schema.org/draft/2020-12/schema
title: Schema kịch bản theo format adversary CALDERA
description: >-
  Kiểm tra từng file YAML của 69 kịch bản sau khi chuẩn hóa thành adversary.
  Mỗi file là một object, sử dụng id và atomic_ordering theo format adversary
  của CALDERA. Schema này dành cho kịch bản mới chuẩn hóa, không bao gồm mọi
  biến thể legacy hoặc dữ liệu xuất từ API CALDERA.
type: object
additionalProperties: false
required:
  - id
  - name
  - description
  - atomic_ordering
properties:
  id:
    type: string
    minLength: 1
    pattern: '\S'
    description: >-
      Mã định danh ổn định của adversary; nên tạo UUID riêng cho mỗi kịch bản.
      Phải duy nhất trong catalog adversary. Không thay đổi ID khi chỉ sửa mô tả.
  name:
    type: string
    minLength: 1
    pattern: '\S'
    description: Tên kịch bản hiển thị trong CALDERA.
  description:
    type: string
    minLength: 1
    pattern: '\S'
    description: >-
      Mô tả mục tiêu và chuỗi hành vi của kịch bản. Có thể dùng YAML block scalar
      để viết nhiều dòng. Metadata bổ sung được lưu trong scenario_plan.
  atomic_ordering:
    type: array
    minItems: 1
    description: >-
      Danh sách ID ability theo thứ tự đề xuất cho planner CALDERA. Mỗi ID phải
      tham chiếu ability có thật, bao gồm ability chuyển đổi từ Atomic Red Team.
      Không dùng mã technique MITRE hoặc mô tả hành vi thay cho ID ability.
      Cho phép lặp ID vì một chuỗi có thể tham chiếu cùng ability nhiều lần;
      hành vi thực thi còn phụ thuộc planner và cấu hình operation.
    items:
      type: string
      minLength: 1
      pattern: '\S'
  objective:
    type: string
    minLength: 1
    pattern: '\S'
    description: >-
      ID objective đã tồn tại trong CALDERA, không phải mục tiêu viết bằng văn bản.
      Có thể bỏ trường này để CALDERA sử dụng objective mặc định.
  tags:
    description: Các nhãn tùy chọn được schema adversary CALDERA hỗ trợ.
    type:
      - array
      - 'null'
    items:
      type: string

# Đây là JSON Schema Draft 2020-12 được biểu diễn bằng YAML.
# Dùng schema này để kiểm tra dữ liệu; không nhập file schema vào CALDERA.
# File kịch bản xuất sang CALDERA nên dùng phần mở rộng .yml vì bộ nạp hiện tại
# tìm adversaries/**/*.yml.
# Validator nghiệp vụ cần kiểm tra riêng: ID adversary duy nhất, ability/objective
# tồn tại và được nạp, nền tảng, executor, quyền, tham số, dependencies và phạm vi.
# Kịch bản chưa ánh xạ được ability được giữ ở nguồn lý thuyết, chưa đạt schema này.
