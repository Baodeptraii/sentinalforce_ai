  \ check-in offline) | Giai đoạn 9 |\n\n**Tổng: 27 techniques/sub-techniques | 9\
  \ tactics phủ**\n\n---\n\n### Log / Telemetry / Observable cần theo dõi\n\n**Giai\
  \ đoạn Social Engineering & Initial Access:**\n- **Okta System Log:** `user.mfa.factor.deactivate`\
  \ – MFA factor bị deactivate; đặc biệt nếu bởi admin khác tài khoản chủ\n- **Okta\
  \ System Log:** `user.mfa.factor.activate` sau khi vừa deactivate (reset + re-enroll\
  \ bởi kẻ tấn công)\n- **Okta System Log:** `user.session.start` từ IP mới không\
  \ có lịch sử, country mới\n- **Entra ID:** Sign-in success từ unfamiliar IP ngay\
  \ sau MFA enrollment event\n- **Helpdesk tickets:** Request reset MFA không đi qua\
  \ self-service, đặc biệt cho admin account; request có urgency cao\n\n**Giai đoạn\
  \ Cloud Discovery & Privilege Escalation:**\n- **Okta System Log:** `system.api_token.create`\
  \ – Tạo API token, đặc biệt từ session mới\n- **Okta System Log:** `user.account.privilege.grant`\
  \ – Role admin được cấp cho user không phải IT admin\n- **Azure AD Audit Log:**\
  \ Nhiều `List users`, `List groups`, `List applications` API call trong thời gian\
  \ ngắn từ IP mới\n- **Azure Activity Log:** `roleAssignments/write` – Role assignment\
  \ mới trên subscription/resource group\n- **AWS CloudTrail (nếu có):** `ListRoles`,\
  \ `ListPolicies`, `GetSecretValue` từ principal mới\n\n**Giai đoạn Lateral Movement\
  \ qua SSO:**\n- **Okta System Log:** Single admin account access nhiều ứng dụng\
  \ khác nhau trong thời gian ngắn (VMware, Citrix, SAP, VPN)\n- **VMware vCenter\
  \ Audit:** Admin login từ IP không phải infrastructure team; snapshot creation;\
  \ VM modification hàng loạt\n- **Citrix:** Admin session từ IP mới truy cập management\
  \ console\n\n**Giai đoạn Credential Access:**\n- **Azure Key Vault:** `SecretGet`\
  \ operation từ service principal hoặc user không thường xuyên access vault này\n\
  - **Microsoft Defender for Cloud Apps:** Impossible travel, mass download từ SharePoint\n\
  - **Slack/Teams audit:** Export conversation history, bulk message read từ IP lạ\n\
  \n**Giai đoạn Defense Evasion:**\n- **Okta:** `policy.lifecycle.update` – Thay đổi\
  \ MFA policy, sign-on policy\n- **Okta:** `authenticator.lifecycle.deactivate` –\
  \ Disable authenticator cho org\n- **Entra ID:** Conditional Access policy modified\
  \ hoặc disabled\n- **Entra ID:** New device registered for admin account từ IP lạ\n\
  \n**Giai đoạn Impact:**\n- **VMware vCenter:** Mass snapshot deletion + mass VM\
  \ reconfiguration trong cùng session\n- **EDR trên VM:** ALPHV/BlackCat binary execution\
  \ pattern; file rename đến `.alphv` / `.blackcat`\n- **Network:** Mass SMB traffic\
  \ từ một nguồn; ALPHV propagation pattern\n\n---\n\n### Gợi ý Detection / Hunting\n\
  \n**Critical – Okta Admin Alerts (phải có ngay):**\n\n```\n// Okta – MFA Reset followed\
  \ by immediate login from new IP\neventType = \"user.mfa.factor.deactivate\" \n\
  → within 10 min → eventType = \"user.session.start\"\nAND client.ipAddress NOT IN\
  \ (user's historical IPs)\n→ CRITICAL ALERT\n```\n\n```\n// Okta – API Token Creation\
  \ from new session\neventType = \"system.api_token.create\"\nAND actor.alternateId\
  \ = admin account\nAND client.geographicalContext.country != usual_country\n→ HIGH\
  \ ALERT\n```\n\n```kql\n// KQL – Entra ID – Privilege escalation in cloud\nAuditLogs\n\
  | where OperationName == \"Add member to role\"\n| where InitiatedBy.user.userPrincipalName\
  \ !in (known_admins)\n| where Result == \"success\"\n| project TimeGenerated, InitiatedBy,\
  \ TargetResources, Result\n```\n\n**Hunting – Impossible travel sau MFA reset:**\n\
  \n```kql\n// Entra Sign-in log – after MFA enroll from new country\nSigninLogs\n\
  | where TimeGenerated > ago(24h)\n| where AuthenticationRequirement == \"multiFactorAuthentication\"\
  \n| where Status.failureReason == \"\" // success\n| summarize locations = make_set(LocationDetails.countryOrRegion)\
  \ by UserPrincipalName\n| where array_length(locations) > 1\n```\n\n**VMware/vCenter\
  \ Hunting:**\n- Monitor: Admin login đến vCenter ngoài business hours từ IP không\
  \ phải jump host\n- Monitor: `vim-cmd vmsvc/snapshot.create` hoặc snapshot operation\
  \ hàng loạt (>10 VMs/5 phút)\n- Alert: VM power state change hàng loạt (>20 VMs\
  \ tắt/5 phút) = possible ransomware via vCenter\n\n**Behavioral Analytics quan trọng:**\n\
  - Helpdesk ticket volume spike cho MFA reset: nếu >5 requests/giờ cho admin account\
  \ → alert\n- Cross-application access pattern: Admin Okta session access >5 ứng\
  \ dụng khác nhau trong <15 phút → suspicious\n- SharePoint: User download >1GB trong\
  \ 30 phút ngoài giờ hành chính → DLP alert\n\n---\n\n### Vì sao đáng ưu tiên 2024–2026\n\
  \nScattered Spider / UNC3944 tiếp tục hoạt động mạnh trong 2024 với các vụ tấn công\
  \ vào ngành retail, viễn thông, và tài chính. Một số thành viên bị bắt (UK, Mỹ)\
  \ nhưng nhóm vẫn tuyển recruit mới. Điều đặc biệt là **pattern tấn công này không\
  \ cần 0-day hay kỹ năng kỹ thuật cao** — chỉ cần social engineering hiệu quả, khiến\
  \ nó cực kỳ khó chặn bằng kỹ thuật thuần túy.\n\nKịch bản này đặc biệt quan trọng\
  \ vì nó chỉ ra **lỗ hổng quy trình** (helpdesk verification) thường bị bỏ qua trong\
  \ diễn tập kỹ thuật. Với sự phát triển của AI voice cloning, viễn cảnh này sẽ chỉ\
  \ trở nên tệ hơn trong 2024–2026.\n\n**Kịch bản này đặc biệt có giá trị diễn tập\
  \ vì:**\n- Kiểm tra quy trình helpdesk identity verification (thường bị bỏ qua)\n\
  - Kiểm tra Okta/Entra alerting cho privilege escalation\n- Kiểm tra VMware/Citrix\
  \ access control và monitoring\n- Red team có thể thực hiện mà không cần kỹ thuật\
  \ cao\n\n**Độ tin cậy:** Rất cao – CISA/FBI Advisory AA23-320A, Mandiant UNC3944\
  \ profile (2023/2024), Microsoft/Okta incident reports (MGM/Caesars).\n\n---\n\n\
