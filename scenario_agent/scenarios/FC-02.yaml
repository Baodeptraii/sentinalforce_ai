content: "# FC-02 – Scattered Spider (UNC3944): Tấn công MGM Resorts & Caesars Entertainment\n\
  ## Chiến dịch Social Engineering + Cloud-Native Ransomware Nổi Bật Nhất 2023\n\n\
  ---\n\n### Giới thiệu chung\n\nScattered Spider (còn gọi là UNC3944, Muddled Libra,\
  \ Octo Tempest, 0ktapus) là một nhóm tội phạm mạng chủ yếu gồm thanh niên nói tiếng\
  \ Anh (Mỹ, UK, Canada), nổi bật vì khả năng **social engineering** cực kỳ tinh vi,\
  \ nhắm vào nhân viên helpdesk để bypass MFA và chiếm quyền quản trị. Nhóm này tấn\
  \ công **MGM Resorts International** (thiệt hại $100M+) và **Caesars Entertainment**\
  \ (trả $15M tiền chuộc) vào tháng 9/2023, gây chú ý toàn cầu.\n\nĐặc điểm nổi bật\
  \ của Scattered Spider khác với APT truyền thống:\n- **Không dùng 0-day** — hoàn\
  \ toàn dựa vào social engineering, MFA bypass, và cloud-native tools\n- **Nói tiếng\
  \ Anh bản ngữ** — gọi điện thuyết phục helpdesk cực kỳ hiệu quả\n- **Tốc độ rất\
  \ cao** — từ initial access đến domain compromise có thể chỉ vài giờ\n- **Cloud-native\
  \ post-exploitation** — nhắm vào Azure AD, Okta, VMware, Citrix\n- **Collaboration\
  \ với RaaS** — cuối 2023 bắt đầu phối hợp với ALPHV/BlackCat để deploy ransomware\n\
  \nCISA và FBI ban hành advisory chung (AA23-320A) về Scattered Spider vào tháng\
  \ 11/2023 sau các vụ tấn công này.\n\n---\n\n### Mô tả kịch bản\n\nKẻ tấn công sử\
  \ dụng thông tin công khai từ LinkedIn để xác định tên và số điện thoại của nhân\
  \ viên IT helpdesk của tổ chức mục tiêu. Sau đó gọi điện giả vờ là nhân viên mới\
  \ gặp sự cố đăng nhập, yêu cầu reset MFA. Helpdesk không xác minh danh tính đúng\
  \ cách và reset token → kẻ tấn công có quyền truy cập Okta/Azure AD → pivot vào\
  \ cloud infrastructure → deploy ransomware (ALPHV/BlackCat) hoặc đánh cắp dữ liệu.\n\
  \nĐiều kiện tiên quyết: Tổ chức dùng Okta/Azure AD cho SSO; helpdesk không có quy\
  \ trình xác minh danh tính nghiêm ngặt; không có SSPR self-service verification\
  \ đầy đủ; cloud tenant không được segmented đúng.\n\n---\n\n### Dòng tấn công end-to-end\n\
  \n```\n[Giai đoạn 1 – Reconnaissance]\nLinkedIn/OSINT → Tìm tên nhân viên, cấu trúc\
  \ tổ chức, số điện thoại helpdesk\n→ Thu thập email/username pattern (first.last@company.com)\n\
  → Dark web: tìm password reuse từ breach\n\n[Giai đoạn 2 – Initial Access qua Social\
  \ Engineering]\nGọi điện đến IT Helpdesk → Giả mạo nhân viên mới / senior executive\n\
  → Khai thác tình huống khẩn cấp (\"I'm traveling, locked out\")\n→ Helpdesk reset\
  \ Okta MFA / SMS MFA\n→ Kẻ tấn công đăng nhập với credential + new MFA\n\n[Giai\
  \ đoạn 3 – Discovery trong Cloud (Okta/Azure AD)]\n→ Enum Okta users, groups, apps\
  \ được gán\n→ Tìm admin accounts, service accounts, Super Admin\n→ Enum Azure AD:\
  \ tenant, subscriptions, VMs, key vaults\n\n[Giai đoạn 4 – Privilege Escalation\
  \ trong Okta]\n→ Tạo Okta Super Admin account mới\n→ Hoặc: Compromise existing admin\
  \ account qua Okta session hijack\n→ Assign admin roles cho account do kẻ tấn công\
  \ kiểm soát\n\n[Giai đoạn 5 – Lateral Movement – On-prem qua Okta SSO]\n→ Dùng Okta\
  \ admin để access on-prem apps (VPN, VMware, Citrix, SAP)\n→ Chiếm VMware vCenter\
  \ → Truy cập toàn bộ VM environment\n→ Chiếm Citrix → Truy cập virtual desktop của\
  \ toàn bộ nhân viên\n\n[Giai đoạn 6 – Credential Access]\n→ Dump credential từ password\
  \ manager, secrets vault\n→ Azure Key Vault: đọc secrets (connection strings, API\
  \ keys)\n→ Okta: export session tokens của C-level executives\n\n[Giai đoạn 7 –\
  \ Defense Evasion]\n→ Disable MFA cho các admin account\n→ Tạo Okta API token để\
  \ duy trì truy cập ngay cả khi password đổi\n→ Thêm trusted device / trusted network\
  \ bypass\n\n[Giai đoạn 8 – Collection & Exfiltration]\n→ SharePoint/OneDrive: Tải\
  \ tài liệu nhạy cảm (business plans, PII, financial)\n→ Customer database download\n\
  → Đánh cắp data trước khi deploy ransomware (double extortion prep)\n\n[Giai đoạn\
  \ 9 – Impact]\n→ Deploy ALPHV/BlackCat ransomware qua VMware vCenter (snapshot all\
  \ VMs → encrypt)\n→ Hoặc: đe doạ công bố data nếu không trả tiền chuộc (Caesars\
  \ scenario)\n→ Gây gián đoạn hoạt động kinh doanh (casino floor, hotel check-in,\
  \ website)\n```\n\n**Timeline thực tế (MGM Resorts 2023):**\n- ~10 phút gọi điện\
  \ → Okta compromise\n- <2 giờ → Okta admin access\n- <4 giờ → VMware/Citrix pivot\n\
  - <24 giờ → Ransomware deployment bắt đầu\n- 10 ngày → Full recovery MGM Resorts\
  \ (thiệt hại $100M+)\n\n---\n\n### MITRE ATT&CK Mapping – Scattered Spider (UNC3944)\n\
