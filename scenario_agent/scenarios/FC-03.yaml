content: "# FC-03 – Volt Typhoon: Xâm Nhập Hạ Tầng Trọng Yếu (Living-off-the-Land\
  \ APT)\n## Chiến dịch Gián Điệp/Pre-positioning Dài Hạn của Nhóm APT Trung Quốc\
  \ 2023–2025\n\n---\n\n### Giới thiệu chung\n\nVolt Typhoon (còn gọi là BRONZE SILHOUETTE,\
  \ Vanguard Panda, KV Botnet operator) là một nhóm APT được cho là liên kết với nhà\
  \ nước Trung Quốc, bị phát hiện bởi Microsoft vào tháng 5/2023. Điểm đặc biệt nhất\
  \ là nhóm này **không sử dụng malware tùy chỉnh** — toàn bộ hoạt động dựa vào **Living-off-the-Land\
  \ (LOL)** — các công cụ có sẵn trong Windows và network devices, khiến việc phát\
  \ hiện cực kỳ khó khăn.\n\nMục tiêu chính của Volt Typhoon **không phải đánh cắp\
  \ dữ liệu ngay** mà là **pre-positioning** — thiết lập và duy trì quyền truy cập\
  \ ẩn trong các hạ tầng trọng yếu của Mỹ (military bases, utilities, water, communications,\
  \ transportation) để sẵn sàng gây gián đoạn trong tình huống xung đột địa chính\
  \ trị.\n\nCISA, NSA, FBI và các đối tác quốc tế (Australia, Canada, New Zealand,\
  \ UK) cùng ban hành advisory về Volt Typhoon vào tháng 2/2024, mô tả sự xâm nhập\
  \ đã duy trì **ít nhất 5 năm** trong một số trường hợp.\n\n**KV Botnet:** Volt Typhoon\
  \ cũng vận hành KV Botnet — mạng các thiết bị SOHO (Cisco RV320, Netgear ProSAFE,\
  \ Axis cameras) bị compromise để làm relay trung gian, ẩn traffic C2 vào trong traffic\
  \ bình thường của ISP.\n\n---\n\n### Mô tả kịch bản\n\nVolt Typhoon khai thác lỗ\
  \ hổng trong các thiết bị edge network lộ ra internet (VPN, router, firewall) để\
  \ xâm nhập. Sau khi vào mạng, nhóm dùng hoàn toàn LOLBins để di chuyển, thu thập\
  \ thông tin, và duy trì truy cập — không cài malware, không để lại file mới. Traffic\
  \ C2 được route qua KV Botnet (các thiết bị SOHO bị compromise) để tránh bị phát\
  \ hiện theo địa lý. Dwell time thường tính bằng tháng đến năm.\n\nĐiều kiện tiên\
  \ quyết: Thiết bị edge network (VPN, Cisco, Fortinet) lộ ra internet và chưa được\
  \ patch; tổ chức không có network segmentation đầy đủ giữa IT và OT; không có baseline\
  \ cho LOLBins usage.\n\n---\n\n### Dòng tấn công end-to-end\n\n```\n[Giai đoạn 1\
  \ – Reconnaissance & Targeting]\nShodan/Censys scan → Xác định edge device model/version\n\
  → Passive reconnaissance: tìm hiểu cấu trúc mạng từ job postings, CVE databases\n\
  → Xác định target liên quan đến military/utilities/communications\n\n[Giai đoạn\
  \ 2 – Initial Access qua Edge Device]\nExploit lỗ hổng VPN/router (Cisco, Fortinet,\
  \ Ivanti, NETGEAR)\n→ Authentication bypass hoặc command injection trên edge device\n\
  → Lấy credentials từ device config\n→ Hoặc: Dùng stolen VPN credential (từ recon)\n\
  \n[Giai đoạn 3 – Establish Foothold (LOL-only)]\n→ Dùng built-in shell/CLI của device\
  \ để thực thi lệnh\n→ Không upload malware; dùng netsh, ntdsutil, wmi, reg, cmd,\
  \ powershell\n→ Dump credentials từ memory/config bằng comsvcs.dll MiniDump\n\n\
  [Giai đoạn 4 – Defense Evasion & Stealth]\n→ Xóa/sửa log trên edge device\n→ Dùng\
  \ built-in admin tools → activity lẫn vào normal admin traffic\n→ Proxy traffic\
  \ qua KV Botnet (SOHO devices) → IP xuất xứ giống US/local ISP\n→ Thời gian hoạt\
  \ động phù hợp múi giờ mục tiêu (giả mạo admin hợp pháp)\n\n[Giai đoạn 5 – Discovery\
  \ (extensive, manual)]\n→ ipconfig /all, route print, netstat -ano, net user, net\
  \ group\n→ Enum network topology: arp -a, ping sweep, traceroute\n→ Xác định OT/ICS\
  \ network path từ IT network\n→ Thu thập thông tin về critical system: SCADA, HMI,\
  \ historian server\n\n[Giai đoạn 6 – Credential Access]\n→ Dump SAM, NTDS.dit bằng\
  \ ntdsutil hoặc VSS\n→ Trích xuất credentials từ Windows Credential Manager, browser\n\
  → Thu thập VPN pre-shared keys, SSH keys từ config files\n\n[Giai đoạn 7 – Lateral\
  \ Movement (LOL)]\n→ Dùng stolen credentials qua RDP, WMI, SMB\n→ SSH lateral movement\
  \ trong Linux/network device environment\n→ Không dùng Cobalt Strike hay tool công\
  \ khai → dùng built-in tools\n\n[Giai đoạn 8 – C2 via KV Botnet Proxy]\n→ Traffic\
  \ từ victim → KV Botnet relay node (SOHO device tại Mỹ) → C2 server\n→ HTTPS traffic\
  \ ẩn trong Cloudflare/legitimate CDN\n→ DNS-over-HTTPS để ẩn DNS query\n\n[Giai\
  \ đoạn 9 – Long-term Persistence]\n→ Tạo admin account ẩn trong AD\n→ Cài SSH authorized_keys\
  \ trên Linux servers\n→ Modify scheduled task / cron job hiện có (thay vì tạo mới)\n\
  → Duy trì truy cập im lặng, không hành động rõ ràng = pre-positioning\n\n[Giai đoạn\
  \ 10 – OT/ICS Pre-positioning (tiềm năng)]\n→ Pivot từ IT sang OT network qua DMZ\n\
  → Map SCADA/ICS topology\n→ Identify potential disruption points (power, water treatment,\
  \ communications)\n→ Không thực hiện destructive action (tránh bị phát hiện) – chỉ\
  \ maintain access\n```\n\n---\n\n### MITRE ATT&CK Mapping – Volt Typhoon\n\n| #\
  \ | Tactic | Technique ID | Sub-technique | Tên kỹ thuật | Giai đoạn |\n|---|--------|-------------|---------------|--------------|-----------|\n\
