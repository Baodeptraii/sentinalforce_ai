  **Tổng: 30 techniques/sub-techniques | 10 tactics phủ**\n\n---\n\n### Log / Telemetry\
  \ / Observable cần theo dõi\n\n**Edge Device & Initial Access:**\n- **Firewall/VPN\
  \ logs:** Auth success từ IP bất thường; đặc biệt exploit pattern trước login (HTTP\
  \ 200 sau nhiều 400/500 errors)\n- **VPN appliance syslog:** Unexpected admin commands;\
  \ config download; credential export commands\n- **Netflow:** Outbound connection\
  \ từ VPN appliance đến non-standard IP; traffic spike bất thường từ edge device\n\
  - **DNS:** Edge device thực hiện DNS query đến external domain (VPN appliances không\
  \ nên resolve external DNS)\n\n**LOLBins Discovery Activity:**\n- **Windows Security\
  \ Event 4688 (với command line logging):**\n  - `whoami /all` từ system account\n\
  \  - `nltest /dclist:` và `nltest /domain_trusts`\n  - `net user /domain`, `net\
  \ group \"Domain Admins\" /domain`\n  - `ipconfig /all`, `route print`, `arp -a`,\
  \ `netstat -ano`\n  - `wmic product get`, `wmic os get`\n- **Sysmon Event 1:** Chuỗi\
  \ các LOLBin liên tiếp trong thời gian ngắn từ cùng một account\n- **PowerShell\
  \ Event 4104:** `Get-ADUser`, `Get-ADGroup`, `Get-ADComputer` hàng loạt từ non-admin\
  \ user\n\n**Credential Dumping (LOL methods):**\n- **Sysmon Event 10:** `comsvcs.dll`\
  \ được load bởi `rundll32.exe` nhắm vào `lsass.exe` (MiniDump method)\n- **Sysmon\
  \ Event 11:** File `lsass.dmp` hoặc tên ngẫu nhiên với kích thước ~40–200MB được\
  \ tạo\n- **Process:** `ntdsutil snapshot create` + `ntdsutil activate instance ntds`\
  \ + copy NTDS.dit (Event 4662)\n- **File access:** VSS shadow copy được mount và\
  \ NTDS.dit được copy\n\n**KV Botnet / C2 Traffic:**\n- **Network:** Outbound HTTPS\
  \ đến SOHO device IP (Cisco RV320, Netgear ProSAFE) — không phải corporate asset\n\
  - **Proxy logs:** Traffic đến unusual IP ở US residential/small business range với\
  \ consistent beaconing pattern (every N minutes)\n- **DNS:** DNS-over-HTTPS (DoH)\
  \ traffic đến Cloudflare/Google 8.8.8.8 từ internal server (không phải DNS server)\n\
  - **JA3/JA3S fingerprint:** Unusual TLS fingerprint không khớp với expected Windows/browser\
  \ client\n\n**Persistence (Modified, không phải mới):**\n- **Windows Security Event\
  \ 4720/4722:** New account creation; đặc biệt account tên giống system account\n\
  - **Sysmon Event 13 (Registry):** `HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\\
  WDigest\\UseLogonCredential` = 1 (force plaintext cred in memory)\n- **Linux:**\
  \ `/etc/passwd`, `/etc/shadow`, `~/.ssh/authorized_keys` modification — FIM alert\n\
  - **Scheduled Task:** Modification của existing task (không tạo mới) — khó phát\
  \ hiện hơn, cần baseline\n\n**Long-term Dwell Indicators:**\n- **Authentication\
  \ patterns:** Account đăng nhập chính xác 8:30 AM giờ US, không bao giờ có failed\
  \ login, không bao giờ có MFA challenge → anomalous pattern (quá \"perfect\")\n\
  - **Network:** Server internal tạo outbound connection đến fixed IP lúc 03:17 AM\
  \ mỗi ngày → beaconing\n\n---\n\n### Gợi ý Detection / Hunting\n\n**Critical – LOLBin\
  \ command chain detection:**\n\n```kql\n// KQL – Detect LOLBin recon chain (Volt\
  \ Typhoon pattern)\nSecurityEvent\n| where EventID == 4688\n| where CommandLine\
  \ has_any (\n    \"whoami /all\", \"nltest /domain_trusts\", \"nltest /dclist\"\
  ,\n    \"net group \\\"Domain Admins\\\"\", \"netstat -ano\", \"route print\",\n\
  \    \"wmic os get\", \"systeminfo\", \"ipconfig /all\"\n  )\n| summarize commands\
  \ = make_set(CommandLine), count=count() \n    by Account, Computer, bin(TimeGenerated,\
  \ 30m)\n| where count > 4\n| order by TimeGenerated desc\n```\n\n```kql\n// KQL\
  \ – Detect comsvcs MiniDump (LOL LSASS dump)\nSecurityEvent\n| where EventID ==\
  \ 4688\n| where CommandLine has \"comsvcs\" and CommandLine has \"MiniDump\"\n \
  \   or CommandLine has \"rundll32\" and CommandLine has \"lsass\"\n```\n\n**Hunting\
  \ – Beaconing detection:**\n\n```kql\n// Network flow analysis – detect periodic\
  \ beaconing\n// Requires network flow data (Zeek, Darktrace, etc.)\n// Look for:\
  \ same destination IP, consistent interval (±10%), \n// small payload (~1-5KB),\
  \ HTTPS, >48 hours continuous\nNetworkFlow\n| where RemotePort == 443\n| summarize\
  \ \n    connection_count = count(),\n    avg_bytes = avg(BytesSent),\n    time_variance\
  \ = stdev(datetime_diff('minute', TimeGenerated, prev(TimeGenerated)))\n    by SrcIP,\
  \ DstIP, bin(TimeGenerated, 1d)\n| where connection_count > 100 and time_variance\
  \ < 2 // very consistent interval\n```\n\n**Hunting – Edge device anomaly:**\n\n\
  ```\n// Firewall/VPN: Alert on CLI commands from management interface\n// Look for:\
  \ show running-config, copy running-config, \n//           show version, show interface,\
  \ show users (cisco)\n// These commands from unusual source IP → IOC\n```\n\n**Hunt\
  \ priority list (Volt Typhoon specific):**\n1. Tìm `ntdsutil` usage bên ngoài DC\
  \ maintenance window\n2. Tìm `comsvcs.dll` được gọi bởi `rundll32.exe`\n3. Tìm account\
  \ mới được tạo với tên gần giống service account tồn tại (1 ký tự khác)\n4. Review\
  \ SSH `authorized_keys` trên tất cả Linux server — tìm key không được ghi nhận trong\
  \ key management system\n5. Tìm scheduled task được modify (không phải tạo mới)\
  \ trong 30 ngày qua\n6. Map tất cả SOHO device IP trong network flow tới external\
  \ destinations lạ\n\n---\n\n### Vì sao đáng ưu tiên 2024–2026\n\nCISA/NSA/FBI Advisory\
  \ (2/2024) cảnh báo Volt Typhoon đã xâm nhập vào cơ sở hạ tầng trọng yếu Mỹ và nhiều\
  \ quốc gia đồng minh, duy trì quyền truy cập ẩn trong nhiều năm. Hơn 400 thiết bị\
  \ SOHO bị compromise cho KV Botnet đã bị FBI neutralize (1/2024), nhưng nhóm tiếp\
  \ tục tái xây dựng botnet. Điều đặc biệt là không có malware đặc trưng nào để detect\
  \ — toàn bộ dựa vào LOLBins.\n\nKịch bản này quan trọng với tổ chức chính phủ, quốc\
  \ phòng, năng lượng, nước, viễn thông — và bất kỳ tổ chức nào là nhà cung cấp cho\
  \ military/government.\n\n**Giá trị diễn tập:** Kiểm tra khả năng phát hiện LOLBins;\
  \ kiểm tra edge device monitoring; kiểm tra OT/ICS segmentation; kiểm tra Network\
  \ Traffic Analysis (NTA/NDR) deployment.\n\n**Độ tin cậy:** Rất cao – CISA Advisory\
  \ AA24-038A (February 2024), Microsoft TI Blog \"Volt Typhoon\" (May 2023), NSA/CISA/FBI\
  \ joint advisory, multiple US government disclosures.\n\n---\n\n### Tài liệu tham\
  \ khảo\n\n- CISA/NSA/FBI: \"Advisory AA24-038A – PRC State-Sponsored Actors Compromise\
  \ and Maintain Persistent Access to U.S. Critical Infrastructure\" (February 2024)\n\
  - Microsoft: \"Volt Typhoon targets US critical infrastructure with living-off-the-land\
  \ techniques\" (May 2023)\n- SecurityScorecard: \"KV Botnet Analysis\" (2024)\n\
  - FBI: \"Court-Authorized Operation Disrupts the KV Botnet\" (January 2024)\n- MITRE\
  \ ATT&CK: T1190, T1090.003, T1003.002, T1070.003, T1584.005\n- Dragos: \"VOLTZITE\
  \ Threat Group\" (2024) [Dragos designation cho Volt Typhoon]\n\n---"
